<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Lakou Pharmacie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>

<div id="lakou-header"></div>

<div class="breadcrumb">
  <a href="index.html">🏠 Lakou Pharmacie</a>
  <span class="sep">›</span>
  <span class="current">Connexion</span>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M6 19V9l6-5 6 5v10M10 19v-6h4v6"/></svg>
    </div>
    <h1>Connexion</h1>
    <p class="auth-sub">Accède à ton espace Lakou Pharmacie.</p>

    <div class="auth-form-message" id="msg"></div>

    <form id="form-login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button class="btn-primary" type="submit" id="btn-submit">Se connecter</button>
    </form>

    <a href="#" class="auth-forgot" id="lien-oubli">Mot de passe oublié ?</a>

    <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
  </div>
</main>

<script>
var form = document.getElementById('form-login');
var msg = document.getElementById('msg');
var btn = document.getElementById('btn-submit');

function afficherMessage(texte, type){
  msg.textContent = texte;
  msg.className = 'auth-form-message show ' + type;
}

form.addEventListener('submit', async function(e){
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  msg.className = 'auth-form-message';

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Se connecter';

  if (error) {
    var texte = "Une erreur est survenue. Réessaie.";
    if (error.message.includes('Invalid login credentials')) {
      texte = "Email ou mot de passe incorrect — ou email pas encore confirmé.";
    } else if (error.message.includes('Email not confirmed')) {
      texte = "Confirme d'abord ton email avant de te connecter.";
    }
    afficherMessage(texte, 'error');
    return;
  }

  afficherMessage("Connexion réussie. Redirection…", 'success');
  setTimeout(function(){ window.location.href = 'dashboard.html'; }, 900);
});

document.getElementById('lien-oubli').addEventListener('click', async function(e){
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  if (!email) {
    afficherMessage("Renseigne ton email ci-dessus d'abord, puis retapote ce lien.", 'error');
    return;
  }
  const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email);
  if (error) {
    afficherMessage("Impossible d'envoyer le lien de réinitialisation.", 'error');
  } else {
    afficherMessage("Email de réinitialisation envoyé à " + email + ".", 'success');
  }
});
</script>

<script src="partials/nav.js"></script>

</body>
</html>
